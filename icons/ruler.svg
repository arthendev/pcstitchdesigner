<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Measurement ruler, drawn horizontally then rotated 45° CCW so it reads as a diagonal ruler -->
  <g transform="rotate(-45 12 12)">
    <rect x="2" y="8.5" width="20" height="7" rx="1.5"
          fill="#e0e0e0" stroke="#333" stroke-width="1.5"/>
    <!-- Graduation ticks: long / short alternating, measured from the top edge.
         Positions are symmetric about the body centre (x=12): +/-6, +/-3, 0. -->
    <g stroke="#333" stroke-width="1.3" stroke-linecap="round">
      <line x1="6"  y1="8.5" x2="6"  y2="11.5"/>
      <line x1="9"  y1="8.5" x2="9"  y2="10.5"/>
      <line x1="12" y1="8.5" x2="12" y2="11.5"/>
      <line x1="15" y1="8.5" x2="15" y2="10.5"/>
      <line x1="18" y1="8.5" x2="18" y2="11.5"/>
    </g>
  </g>
</svg>
